[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-mx-watcher"
version = "0.1.0"
description = "Monitor de stock y precio para productos de amazon.com.mx, con notificaciones para compra manual."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[project.scripts]
amazon-mx-watcher = "amazon_mx_watcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
